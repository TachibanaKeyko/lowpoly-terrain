<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Low-poly terrain 1×1 km</title>
<meta property="og:title" content="Low-poly terrain 1×1 km">
<meta property="og:image" content="preview.png">
<style>
  :root { --bg: #d6bda1; --ink: #1f2a33; --card: rgba(255, 255, 255, 0.82); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); }
  canvas { display: block; touch-action: none; }
  .card { position: fixed; left: 16px; top: 16px; max-width: calc(100% - 32px); padding: 12px 14px; border-radius: 12px; background: var(--card); backdrop-filter: blur(8px); box-shadow: 0 4px 18px rgba(0, 0, 0, 0.12); }
  .card h1 { margin: 0; font-size: 16px; }
  .card p { margin: 2px 0 0; opacity: 0.75; }
  .loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 15px; }
  .loading.done { display: none; }
</style>
</head>
<body>
<div class="card">
  <h1>Low-poly terrain 1×1 km</h1>
  <p>Двойной клик — подлететь к точке</p>
</div>
<div class="loading" id="loading">Загружаю карту…</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

//Свет, дымка и цвета - те же, что в сцене Unity
const SKY = 0xd6bda1;
const FOG = 0.0022;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.FogExp2(SKY, FOG);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.5, 3000);
const fit = Math.pow(Math.max(1, 1.1 / (innerWidth / innerHeight)), 0.75);
camera.position.set(-560, 560, 560).multiplyScalar(fit);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 5, 0);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.47;
controls.minDistance = 3;
controls.maxDistance = 1600;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.4;
controls.addEventListener('start', () => { controls.autoRotate = false; });

scene.add(new THREE.HemisphereLight(0xc9b6a0, 0x4d4036, 1.35));

//Солнце Euler(22, -60) из Unity; тень считается только вокруг точки, на которую смотрит камера
const sun = new THREE.DirectionalLight(0xffd6a3, 4.2);
const SUN_DIR = new THREE.Vector3(161, 75, 93).normalize();
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.25;
scene.add(sun, sun.target);

//Цвета записаны в sRGB, а three.js ждёт линейные
const toLinear = v => { const c = v / 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };

const land = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, metalness: 0, flatShading: true });
const grass = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, metalness: 0, flatShading: true, side: THREE.DoubleSide });
const water = new THREE.MeshStandardMaterial({ vertexColors: true, color: 0x6a979e, roughness: 0.2, metalness: 0, transparent: true, opacity: 0.82, flatShading: true });

const buffer = await (await fetch('land.bin')).arrayBuffer();
const view = new DataView(buffer);
let offset = 0;
const int = () => { const v = view.getInt32(offset, true); offset += 4; return v; };
const float = () => { const v = view.getFloat32(offset, true); offset += 4; return v; };

function readGeometry() {
  const n = int();
  const positions = new Float32Array(buffer.slice(offset, offset + n * 12)); offset += n * 12;
  const bytes = new Uint8Array(buffer, offset, n * 3); offset += n * 3;
  const colors = new Float32Array(n * 3);
  for (let i = 0; i < colors.length; i++) colors[i] = toLinear(bytes[i]);
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geometry.computeVertexNormals();
  return geometry;
}

if (int() !== 2) throw new Error('Не та версия land.bin');

//Запечённое: земля, трава, река, лагеря, мосты
const solid = [];
for (let m = int(); m > 0; m--) {
  const name = new TextDecoder().decode(new Uint8Array(buffer, offset + 4, view.getInt32(offset, true)));
  offset += 4 + view.getInt32(offset, true);
  const geometry = readGeometry();
  const mesh = new THREE.Mesh(geometry, name === 'River' ? water : name === 'Grass' ? grass : land);
  mesh.castShadow = name !== 'River' && name !== 'Grass';
  mesh.receiveShadow = true;
  mesh.frustumCulled = false;
  scene.add(mesh);
  if (name === 'Terrain' || name === 'Bridges') solid.push(mesh);
}

//Модели деревьев и камней - по одной, дальше только расстановка
const protos = [];
for (let p = int(); p > 0; p--) protos.push({ geometry: readGeometry(), items: [] });

//LODGroup как в Unity: уровень выбирается по доле высоты экрана, которую занимает объект
const groups = [];
const matrix = new THREE.Matrix4();
for (let g = int(); g > 0; g--) {
  const group = { center: new THREE.Vector3(float(), float(), float()), size: float(), lods: [], level: -2 };
  for (let l = int(); l > 0; l--) {
    const lod = { height: float(), items: [] };
    for (let i = int(); i > 0; i--) {
      const proto = int();
      const e = [];
      for (let k = 0; k < 12; k++) e.push(float());
      //3x4 по столбцам -> полная матрица 4x4
      matrix.set(e[0], e[3], e[6], e[9], e[1], e[4], e[7], e[10], e[2], e[5], e[8], e[11], 0, 0, 0, 1);
      lod.items.push({ proto, matrix: matrix.clone() });
    }
    group.lods.push(lod);
  }
  groups.push(group);
}

const instanced = protos.map((p, i) => {
  let capacity = 0;
  for (const g of groups) for (const lod of g.lods) for (const it of lod.items) if (it.proto === i) capacity++;
  const mesh = new THREE.InstancedMesh(p.geometry, land, Math.max(1, capacity));
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.frustumCulled = false;
  mesh.count = 0;
  scene.add(mesh);
  return mesh;
});

//Пересборка видимых уровней - только когда камера заметно сдвинулась
//Как на качестве Ultra в Unity: детальные деревья держатся дальше
const LOD_BIAS = 2;
const lastEye = new THREE.Vector3(1e9, 0, 0);
function updateLods(force) {
  if (!force && camera.position.distanceToSquared(lastEye) < 4) return;
  lastEye.copy(camera.position);
  const tan = Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2);
  for (const m of instanced) m.count = 0;
  for (const g of groups) {
    const relative = g.size / (2 * Math.max(0.01, camera.position.distanceTo(g.center)) * tan) * LOD_BIAS;
    //Деревья вдали не пропадают, а остаются упрощёнными: так карта не лысеет на общем виде
    const lod = g.lods.find(l => relative >= l.height) ?? (g.lods.length > 1 ? g.lods[g.lods.length - 1] : null);
    if (!lod) continue;
    for (const it of lod.items) {
      const m = instanced[it.proto];
      m.setMatrixAt(m.count++, it.matrix);
    }
  }
  for (const m of instanced) m.instanceMatrix.needsUpdate = true;
}
updateLods(true);

//Для проверки снимками: поставить камеру в точку и смотреть на цель
window.lookFrom = (x, y, z, tx, ty, tz) => {
  controls.autoRotate = false;
  camera.position.set(x, y, z);
  controls.target.set(tx, ty, tz);
};

document.getElementById('loading').classList.add('done');

//Двойной клик (или двойной тап) - камера плавно подлетает к этой точке и крутится вокруг неё
const raycaster = new THREE.Raycaster();
let flight = null;
addEventListener('dblclick', e => {
  raycaster.setFromCamera(new THREE.Vector2(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1), camera);
  const hit = raycaster.intersectObjects(solid)[0];
  if (!hit) return;
  controls.autoRotate = false;
  const target = hit.point.clone();
  const away = camera.position.clone().sub(controls.target).setLength(Math.max(14, Math.min(45, hit.distance * 0.3)));
  if (away.y < 6) away.y = 6;
  flight = { target, position: target.clone().add(away), t: 0 };
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  if (flight) {
    flight.t = Math.min(1, flight.t + 0.03);
    controls.target.lerp(flight.target, 0.1);
    camera.position.lerp(flight.position, 0.1);
    if (flight.t >= 1) flight = null;
  }
  controls.update();

  //Издалека туман съел бы всю карту, поэтому он густеет только по мере приближения
  const distance = camera.position.distanceTo(controls.target);
  scene.fog.density = FOG * THREE.MathUtils.clamp(180 / distance, 0.12, 1);

  //Область тени - вокруг точки взгляда, размер по расстоянию до неё
  const box = THREE.MathUtils.clamp(distance * 1.2, 60, 700);
  Object.assign(sun.shadow.camera, { left: -box, right: box, top: box, bottom: -box, near: 1, far: 2000 });
  sun.shadow.camera.updateProjectionMatrix();
  sun.target.position.copy(controls.target);
  sun.position.copy(controls.target).addScaledVector(SUN_DIR, 800);

  updateLods(false);
  renderer.render(scene, camera);
});
</script>
</body>
</html>
